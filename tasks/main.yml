---

# Put GoW's persistent state on a dedicated volume (off the OS root) before any
# state directory is created or written. Disabled by default; see
# gow_data_volume in defaults/main.yml. Uses builtin modules only.
- name: Provision GoW data volume
  when: gow_data_volume.enabled | bool
  become: true
  vars:
    gow_data_mountpoint: "{{ gow_data_volume.mountpoint or gow_paths.state }}"
  block:
    - name: "Validate gow_data_volume.device is set"
      ansible.builtin.assert:
        that:
          - gow_data_volume.device | length > 0
        fail_msg: "gow_data_volume.enabled is true but gow_data_volume.device is empty"

    - name: "Ensure mountpoint {{ gow_data_mountpoint }} exists"
      ansible.builtin.file:
        path: "{{ gow_data_mountpoint }}"
        state: directory

    - name: "Probe existing filesystem on {{ gow_data_volume.device }}"
      ansible.builtin.command: "blkid -s TYPE -o value {{ gow_data_volume.device }}"
      register: gow_data_existing_fstype
      changed_when: false
      failed_when: false

    - name: "Create {{ gow_data_volume.fstype }} filesystem on {{ gow_data_volume.device }}"
      ansible.builtin.command: "mkfs -t {{ gow_data_volume.fstype }} {{ gow_data_volume.device }}"
      # Only format a blank device, so re-running the role never wipes data.
      when:
        - gow_data_volume.format | bool
        - (gow_data_existing_fstype.stdout | trim) | length == 0

    - name: "Read UUID of {{ gow_data_volume.device }}"
      ansible.builtin.command: "blkid -s UUID -o value {{ gow_data_volume.device }}"
      register: gow_data_uuid
      changed_when: false

    - name: "Persist mount of {{ gow_data_mountpoint }} in /etc/fstab"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '[[:space:]]{{ gow_data_mountpoint }}[[:space:]]'
        line: "UUID={{ gow_data_uuid.stdout | trim }} {{ gow_data_mountpoint }} {{ gow_data_volume.fstype }} {{ gow_data_volume.mount_opts }} 0 2"

    - name: "Check whether {{ gow_data_mountpoint }} is already mounted"
      ansible.builtin.command: "mountpoint -q {{ gow_data_mountpoint }}"
      register: gow_data_mounted
      changed_when: false
      failed_when: false

    - name: "Mount {{ gow_data_mountpoint }}"
      ansible.builtin.command: "mount {{ gow_data_mountpoint }}"
      when: gow_data_mounted.rc != 0

- name: First time setup
  block:
    - name: "create folder {{ gow_paths.base }}"
      ansible.builtin.file:
       path: "{{ gow_paths.base }}"
       state: directory

    - name: "create folder {{ gow_paths.state }}"
      ansible.builtin.file:
       path: "{{ gow_paths.state }}"
       state: directory

    - name: git checkout games-on-whales/gow
      ansible.builtin.git:
        repo: https://github.com/games-on-whales/gow.git
        dest: "{{ gow_paths.git }}"
        update: true
        accept_hostkey: true
  when: first_time_setup is defined and first_time_setup

- name: Custom GOW configuration
 # https://games-on-whales.github.io/gow/configuration.html
  block:
  - name: "create file {{ gow_paths.user_env }}"
    ansible.builtin.file:
     path: "{{ gow_paths.user_env }}"
     state: touch

  - name: "Update local_state path"
    lineinfile:
      path: "{{ gow_paths.user_env }}"
      regexp: '^local_state=(.*)$'
      line: 'local_state={{ gow_paths.state }}'
      backrefs: yes

  # TODO: timezone, uid, gid, display, ...

- name: Run GOW
  block:
    - name: Create run-gow command
      ansible.builtin.set_fact:
        run_gow_options: "--streamer {{ run_gow.streamer }} --platform {{ run_gow.platform }} {{ ['--app '] | product(run_gow.applications) | map('join') | join(' ') }} {{ '--gpu' + run_gow.gpu if run_gow.gpu is defined else '' }} "
      when: run_gow_options is not defined

    - name: Update GOW containers
      ansible.builtin.shell: ./run-gow {{ run_gow_options }} pull
      args:
        chdir: "{{ gow_paths.git }}"
      when: update_containers

    - name: Start GOW (via run-gow) in background
      ansible.builtin.shell: ./run-gow {{ run_gow_options }} up -d
      args:
        chdir: "{{ gow_paths.git }}"

- name: End info
  debug:
    msg: "You can access Sunshine's web UI at 'https://{{ ansible_host }}:47990' and login using admin/admin (dont forget to change this) to approve of pins"